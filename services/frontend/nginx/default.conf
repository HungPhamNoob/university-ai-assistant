# services/frontend/nginx/default.conf
# Serves the static chat UI and proxies API traffic to the Kong gateway.

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # JS/CSS: luôn revalidate (no-cache = hỏi lại server trước khi dùng cache;
    # nginx trả 304 rẻ nếu không đổi). Không có rule này, browser tự cache
    # heuristic nhiều giờ và UI cũ vẫn hiển thị sau khi rebuild frontend.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Proxy chat + domain APIs to Kong (single origin for the browser)
    location /api/ {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE needs buffering disabled
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /auth/ {
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /conversations {
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
