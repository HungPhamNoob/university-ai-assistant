[project]
name = "uet-ai-assistant"
version = "1.0.0"
description = "Multi-agent university assistant for UET"
requires-python = ">=3.11"
dependencies = [
    # Core LangChain stack
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.30",
    "langgraph-checkpoint-postgres>=2.0.0",  # ← Thay SQLite bằng Postgres
    "langchain-huggingface>=0.1.0",
    # Vector DB
    "qdrant-client>=1.12.0",
    # Embedding & Reranking
    "sentence-transformers>=3.0.1",
    "rank-bm25>=0.2.2",
    # FastAPI stack (microservices)
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg[binary,pool]>=3.2.0",
    "alembic>=1.13.0",
    # Redis
    "redis>=5.0.0",
    # Auth
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    # HTTP client for internal service communication
    "httpx>=0.27.0",
    # PDF processing
    "pypdf>=5.0.0",
    # Evaluation
    "ragas>=0.2.0",
    # Observability (LangSmith via env, no code changes needed)
    # Removed langfuse - using LangSmith instead
    # Utilities
    "python-dotenv>=1.0.1",
    "tiktoken>=0.8.0",
    "pydantic>=2.8.2",
    "numpy>=1.26.4",
    "datasets>=2.21.0",
    "tenacity>=9.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "langchain-core>=1.5.3",
    "tavily-python>=0.8.1",
    "playwright>=1.55.0",
    "tabulate>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.ruff.lint]
# Project convention (documented in hint.md §4 / §8): scheduling stores and
# compares naive local datetimes ("YYYY-MM-DD HH:MM"). Making these timezone-aware
# would change booking/reply semantics; the DTZ family is therefore disabled.
# Individual broad-except sites are annotated with `# noqa: BLE001` in code.
ignore = ["DTZ"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection: `Depends(...)` as a route default is the
# canonical idiom, not a call-in-default bug (B008).
"services/agent/api.py" = ["B008"]
"services/rag/api.py" = ["B008"]
"services/booking/routers/*.py" = ["B008"]
"services/conversation/routes/*.py" = ["B008"]
"services/identity/users/routes.py" = ["B008"]
